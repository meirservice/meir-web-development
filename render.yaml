# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: meir-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: OWNER_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        value: Bookings
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Asia/Manila
      - key: BUSINESS_TIMEZONE_LABEL
        value: Philippine Time, UTC+8
