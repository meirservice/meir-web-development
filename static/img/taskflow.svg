<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003594"/>
      <stop offset="1" stop-color="#1b2a56"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <circle cx="690" cy="90" r="130" fill="none" stroke="#cdb87f" stroke-width="24" opacity=".2"/>
  <circle cx="110" cy="420" r="90" fill="none" stroke="#ffb81c" stroke-width="16" opacity=".14"/>

  <!-- floating card left -->
  <g filter="url(#sh)">
    <rect x="96" y="150" width="190" height="120" rx="16" fill="#ffffff"/>
  </g>
  <text x="116" y="182" font-size="13" font-weight="700" fill="#5f6a89">This week</text>
  <text x="116" y="216" font-size="30" font-weight="700" fill="#1b2a56">24 tasks</text>
  <rect x="116" y="234" width="150" height="8" rx="4" fill="#e6ebf5"/>
  <rect x="116" y="234" width="104" height="8" rx="4" fill="#003594"/>
  <text x="116" y="258" font-size="11" fill="#5f6a89">70% complete</text>

  <!-- floating card right -->
  <g filter="url(#sh)">
    <rect x="520" y="232" width="190" height="104" rx="16" fill="#ffffff"/>
  </g>
  <rect x="540" y="296" width="18" height="24" rx="4" fill="#e6ebf5"/>
  <rect x="566" y="280" width="18" height="40" rx="4" fill="#e6ebf5"/>
  <rect x="592" y="266" width="18" height="54" rx="4" fill="#003594"/>
  <rect x="618" y="286" width="18" height="34" rx="4" fill="#e6ebf5"/>
  <rect x="644" y="256" width="18" height="64" rx="4" fill="#ffb81c"/>
  <rect x="670" y="276" width="18" height="44" rx="4" fill="#e6ebf5"/>
  <text x="540" y="256" font-size="12" font-weight="700" fill="#1b2a56">Activity</text>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="320" y="36" width="170" height="420" rx="30" fill="#0f1834"/>
  </g>
  <rect x="330" y="46" width="150" height="400" rx="22" fill="#ffffff"/>
  <rect x="380" y="54" width="50" height="10" rx="5" fill="#0f1834"/>
  <text x="346" y="96" font-size="11" fill="#5f6a89">Good morning</text>
  <text x="346" y="116" font-size="17" font-weight="700" fill="#1b2a56">TaskFlow</text>
  <circle cx="460" cy="104" r="12" fill="#cdb87f"/>

  <!-- ring -->
  <circle cx="405" cy="176" r="40" fill="none" stroke="#e6ebf5" stroke-width="12"/>
  <circle cx="405" cy="176" r="40" fill="none" stroke="#003594" stroke-width="12" stroke-linecap="round" stroke-dasharray="176 252" transform="rotate(-90 405 176)"/>
  <text x="405" y="182" font-size="18" font-weight="700" fill="#1b2a56" text-anchor="middle">70%</text>

  <!-- task list -->
  <g font-size="11" fill="#1b2a56">
    <rect x="344" y="236" width="122" height="38" rx="10" fill="#f6f2e8"/>
    <circle cx="360" cy="255" r="7" fill="#003594"/>
    <path d="M356.5 255 l2.5 2.5 l4.5 -5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect x="374" y="251" width="70" height="8" rx="4" fill="#1b2a56" opacity=".75"/>

    <rect x="344" y="282" width="122" height="38" rx="10" fill="#f6f2e8"/>
    <circle cx="360" cy="301" r="7" fill="#003594"/>
    <path d="M356.5 301 l2.5 2.5 l4.5 -5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect x="374" y="297" width="56" height="8" rx="4" fill="#1b2a56" opacity=".75"/>

    <rect x="344" y="328" width="122" height="38" rx="10" fill="#ffffff" stroke="#e4e6ee" stroke-width="2"/>
    <circle cx="360" cy="347" r="7" fill="none" stroke="#cdb87f" stroke-width="2"/>
    <rect x="374" y="343" width="78" height="8" rx="4" fill="#d9dce6"/>
  </g>

  <!-- add button -->
  <circle cx="405" cy="404" r="20" fill="#ffb81c"/>
  <path d="M405 395 v18 M396 404 h18" stroke="#1b2a56" stroke-width="3" stroke-linecap="round"/>
</svg>
